kind = "web"
previewPath = "/"
title = "Alfred Salud"
version = "1.0.0"
id = "artifacts/alfred-salud-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21939

[services.development]
run = "pnpm --filter @workspace/alfred-salud-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alfred-salud-app", "run", "build" ]
publicDir = "artifacts/alfred-salud-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21939"
BASE_PATH = "/"
